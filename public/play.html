<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sk'ultureG — Joueur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/theme.css">
<style>
  #play-root{min-height:100vh;display:flex;flex-direction:column;padding:1.2rem;gap:1rem}
  .play-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:.8rem}
  .buzz-btn{width:100%;padding:2.5rem 1rem;font-family:'Poppins';font-weight:800;font-size:1.8rem;letter-spacing:.1em;border-radius:16px;border:2px solid var(--red);background:rgba(255,0,60,.15);box-shadow:0 0 24px rgba(255,0,60,.4);color:#fff;cursor:pointer}
  .buzz-btn:active{transform:scale(.97);background:rgba(255,0,60,.35)}
</style>
</head>
<body>
<div id="play-root">
  <div class="play-header">
    <div class="font-display neon-text-purple" id="me-pseudo">—</div>
    <div class="font-mono small">Room <span id="me-room" class="neon-text-purple"></span></div>
  </div>
  <div id="play-body" style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:1rem">
    <div class="small" style="text-align:center;color:var(--muted)">En attente du jeu…</div>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/socket-client.js"></script>
<script src="/js/play.js"></script>
</body>
</html>
